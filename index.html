<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#050506" />
  <meta name="color-scheme" content="dark" />
  <title>brennengreen.dev</title>
  <link rel="icon" href="data:," />
  <style>
    :root {
      --bg: #030303;
      --fg: #e8e8ea;
      --dim: #7a7a80;
      --xbox: #107c10;
      --blizzard: #009ae4;
      --twitch: #9146ff;
      --intel: #0071c5;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at 50% 40%, #0c0c0d 0%, var(--bg) 70%);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      min-height: 100vh;
      padding: 2rem;
    }

    .headline {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: lowercase;
      color: var(--fg);
    }

    .roles {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      font-size: clamp(1.1rem, 3vw, 1.8rem);
      font-weight: 500;
      letter-spacing: 0.01em;
      text-align: center;
    }

    .roles li {
      color: var(--dim);
    }

    .role-title {
      color: var(--fg);
      font-weight: 400;
    }

    .company {
      font-weight: 700;
    }

    .company--xbox {
      color: var(--xbox);
    }

    .company--blizzard {
      color: var(--blizzard);
    }

    .company--twitch {
      color: var(--twitch);
    }

    .company--intel {
      color: var(--intel);
    }

    .dw-d {
      color: #e8332b;
    }
    .dw-r1 {
      color: #2e6fd9;
    }
    .dw-e {
      color: #f2a91c;
    }
    .dw-a {
      color: #7b4fa6;
    }
    .dw-m {
      color: #3aa655;
    }
    .dw-w {
      color: #e8332b;
    }
    .dw-o {
      color: #2e6fd9;
    }
    .dw-r2 {
      color: #f2a91c;
    }
    .dw-k {
      color: #7b4fa6;
    }
    .dw-s {
      color: #3aa655;
    }

    .resume-link {
      color: var(--dim);
      font-size: 0.95rem;
      letter-spacing: 0.02em;
      text-decoration: none;
      border-bottom: 1px solid var(--dim);
      padding-bottom: 0.15rem;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .resume-link:hover,
    .resume-link:focus-visible {
      color: var(--fg);
      border-color: var(--fg);
    }

    @media (prefers-reduced-motion: no-preference) {
      .roles li {
        animation: fade-up 0.6s ease both;
      }

      .roles li:nth-child(1) {
        animation-delay: 0.05s;
      }
      .roles li:nth-child(2) {
        animation-delay: 0.15s;
      }
      .roles li:nth-child(3) {
        animation-delay: 0.25s;
      }
      .roles li:nth-child(4) {
        animation-delay: 0.35s;
      }
      .roles li:nth-child(5) {
        animation-delay: 0.45s;
      }
    }

    @keyframes fade-up {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
  <script data-goatcounter="https://brennengreen.goatcounter.com/count"
          async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
  <h1 class="headline">brennen</h1>
  <ul class="roles">
    <li><span class="role-title">developer relations @</span> <span class="company company--xbox">xbox</span></li>
    <li><span class="role-title">engineering @</span> <span class="company company--dreamworks"><span class="dw-d">d</span><span class="dw-r1">r</span><span class="dw-e">e</span><span class="dw-a">a</span><span class="dw-m">m</span><span class="dw-w">w</span><span class="dw-o">o</span><span class="dw-r2">r</span><span class="dw-k">k</span><span class="dw-s">s</span></span></li>
    <li><span class="role-title">engineering @</span> <span class="company company--blizzard">blizzard</span></li>
    <li><span class="role-title">engineering @</span> <span class="company company--twitch">twitch</span></li>
    <li><span class="role-title">engineering @</span> <span class="company company--intel">intel</span></li>
  </ul>
  <a class="resume-link" href="/bg_resume.pdf" target="_blank" rel="noopener">resume</a>
</body>
</html>
