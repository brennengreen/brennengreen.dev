<head>

  <style>
    :root {
      --bg: #030303;
      --fg: #e8e8ea;
      --dim: #7a7a80;
      --xbox: #107c10;
      --blizzard: #009ae4;
      --twitch: #9146ff;
      --intel: #0071c5;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at 50% 40%, #0c0c0d 0%, var(--bg) 70%);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      min-height: 100vh;
      padding: 2rem;
    }

    .headline {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: lowercase;
      color: var(--fg);
    }

    .roles {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      font-size: clamp(1.1rem, 3vw, 1.8rem);
      font-weight: 500;
      letter-spacing: 0.01em;
      text-align: center;
    }

    .roles li {
      color: var(--dim);
    }

    .role-title {
      color: var(--fg);
      font-weight: 400;
    }

    .company {
      font-weight: 700;
    }

    .company--xbox {
      color: var(--xbox);
    }

    .company--blizzard {
      color: var(--blizzard);
    }

    .company--twitch {
      color: var(--twitch);
    }

    .company--intel {
      color: var(--intel);
    }

    .dw-d {
      color: #e8332b;
    }
    .dw-r1 {
      color: #2e6fd9;
    }
    .dw-e {
      color: #f2a91c;
    }
    .dw-a {
      color: #7b4fa6;
    }
    .dw-m {
      color: #3aa655;
    }
    .dw-w {
      color: #e8332b;
    }
    .dw-o {
      color: #2e6fd9;
    }
    .dw-r2 {
      color: #f2a91c;
    }
    .dw-k {
      color: #7b4fa6;
    }
    .dw-s {
      color: #3aa655;
    }

    .resume-link {
      color: var(--dim);
      font-size: 0.95rem;
      letter-spacing: 0.02em;
      text-decoration: none;
      border-bottom: 1px solid var(--dim);
      padding-bottom: 0.15rem;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .resume-link:hover,
    .resume-link:focus-visible {
      color: var(--fg);
      border-color: var(--fg);
    }

    .corner-peek {
      position: fixed;
      top: 0;
      right: 0;
      width: 14px;
      height: 14px;
      overflow: hidden;
      z-index: 10;
    }

    .corner-peek::before,
    .corner-peek::after {
      content: "";
      position: absolute;
      inset: 0;
    }

    .corner-peek::before {
      background: #080808;
      clip-path: polygon(0 0, 100% 0, 100% 100%);
    }

    .corner-peek::after {
      background: linear-gradient(135deg, #efeff1 0%, #9b9ba0 47%, #313136 50%, #111113 54%);
      clip-path: polygon(0 0, 100% 100%, 0 100%);
      filter: drop-shadow(2px 2px 3px rgb(0 0 0 / 0.45));
      z-index: 2;
    }

    .corner-eyes {
      position: absolute;
      top: 13px;
      right: 6px;
      width: 43px;
      height: 13px;
      opacity: 0;
      z-index: 1;
    }

    .corner-eyes::before,
    .corner-eyes::after {
      content: "";
      position: absolute;
      top: 1px;
      width: 15px;
      height: 8px;
      border-radius: 70% 30% 70% 30%;
      background: radial-gradient(circle at 55% 50%, #090900 0 24%, #ffe45c 28% 64%, #9c7200 68%);
      box-shadow: 0 0 5px #ffd83d, 0 0 10px rgb(255 216 61 / 0.45);
    }

    .corner-eyes::before {
      left: 4px;
      transform: rotate(8deg);
    }

    .corner-eyes::after {
      right: 2px;
      transform: rotate(-8deg) scaleX(-1);
    }

    .corner-peek:hover {
      width: 68px;
      height: 68px;
    }

    .corner-peek:hover .corner-eyes {
      opacity: 1;
    }

    @media (prefers-reduced-motion: no-preference) {
      .roles li {
        animation: fade-up 0.6s ease both;
      }

      .corner-peek {
        transition: width 0.3s ease, height 0.3s ease;
      }

      .corner-eyes {
        transition: opacity 0.16s ease 0.12s;
      }

      .roles li:nth-child(1) {
        animation-delay: 0.05s;
      }
      .roles li:nth-child(2) {
        animation-delay: 0.15s;
      }
      .roles li:nth-child(3) {
        animation-delay: 0.25s;
      }
      .roles li:nth-child(4) {
        animation-delay: 0.35s;
      }
      .roles li:nth-child(5) {
        animation-delay: 0.45s;
      }
    }

    @keyframes fade-up {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>

</head>
