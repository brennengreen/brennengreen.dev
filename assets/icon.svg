<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <clipPath id="tile"><rect width="64" height="64" rx="14"/></clipPath>
    <linearGradient id="spectrum" gradientUnits="userSpaceOnUse" x1="0" y1="20" x2="0" y2="44">
      <stop offset="0" stop-color="#ff4d6d" stop-opacity="0"/>
      <stop offset=".1" stop-color="#ff4d6d"/>
      <stop offset=".27" stop-color="#ff9a3d"/>
      <stop offset=".44" stop-color="#ffe07a"/>
      <stop offset=".5" stop-color="#fff4e0"/>
      <stop offset=".58" stop-color="#5fe39a"/>
      <stop offset=".76" stop-color="#4ea4ff"/>
      <stop offset=".9" stop-color="#9a6bff"/>
      <stop offset="1" stop-color="#9a6bff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="-8" x2="72">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".65"/>
    </linearGradient>
    <mask id="length" maskUnits="userSpaceOnUse" x="-40" y="-40" width="144" height="144">
      <rect x="-40" y="-40" width="144" height="144" fill="url(#fade)"/>
    </mask>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation=".6"/>
    </filter>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="#050608"/>
    <rect x="-24" y="20" width="112" height="24" fill="url(#spectrum)" mask="url(#length)" filter="url(#soft)" transform="rotate(33 32 32)"/>
  </g>
</svg>
